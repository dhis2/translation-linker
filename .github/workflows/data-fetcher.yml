name: Data Fetcher

on:
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '32 23 * * *'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
    
    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install transifex-python
        pip install six

    - name: Set up commit signing
      uses: dhis2/action-commit-signing@v1
      with:
        ssh-signing-key: ${{ secrets.DHIS2_BOT_SSH_SIGNING_KEY }}
        ssh-signing-key-passphrase: ${{ secrets.DHIS2_BOT_SSH_SIGNING_PASSPHRASE }}
        
    - name: Run the script
      run: python3 transifex-data-fetcher.py
      shell: bash
      env:
        TX_TOKEN: ${{ secrets.DHIS2_TX_TOKEN }}

    - name: touch the updated file
      run: ls -al data
      shell: bash
      
    - name: Commit & Push changes
      shell: bash
      run: |
        git add -A data
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -S -m "chore: autopublish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        git push origin HEAD:${{ github.ref_name }}
